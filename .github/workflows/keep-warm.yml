name: keep-warm

# Pings the deployed /health endpoint every 10 minutes so Render's free
# tier never sees 15+ minutes of inactivity (which triggers a slow
# cold-start on the next request). This runs continuously rather than only
# during the 7 PM-11 PM round window, since the round's exact calendar
# date isn't encoded here -- it's cheap (a handful of GitHub Actions
# minutes per day, well within the free private-repo quota) and removes
# any risk of a timezone/date mistake silently disabling it during
# judging. Disable this workflow from the Actions tab once the
# preliminary round is over.

"on":
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -sf --max-time 20 https://gridwise-llm-bup-cse-fest-2026.onrender.com/health
